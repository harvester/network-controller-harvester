---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {}
  name: hostnetworkconfigs.network.harvesterhci.io
spec:
  group: network.harvesterhci.io
  names:
    kind: HostNetworkConfig
    listKind: HostNetworkConfigList
    plural: hostnetworkconfigs
    shortNames:
    - hnc
    - hncs
    singular: hostnetworkconfig
  scope: Cluster
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              clusterNetwork:
                description: Required, non-empty
                minLength: 1
                type: string
              description:
                type: string
              gatewayIPv4:
                description: Optional default gateway for IPv4 (applies to all nodes)
                type: string
              gatewayIPv6:
                description: Optional default gateway for IPv6 (applies to all nodes)
                type: string
              hostMultiFamilyIPs:
                additionalProperties:
                  description: MultiFamilyIPConfig holds multi-family IP configurations
                    per host.
                  properties:
                    ipv4:
                      description: Optional unique IPv4 address and subnet mask for
                        this node
                      maxLength: 64
                      type: string
                      x-kubernetes-validations:
                      - message: ipv4 must be a valid IPv4 address/CIDR
                        rule: cidr(string(self)).ip().family() == 4
                      - message: Invalid CIDR format
                        rule: isCIDR(self)
                    ipv6:
                      description: Optional unique IPv6 address and subnet mask for
                        this node
                      maxLength: 64
                      type: string
                      x-kubernetes-validations:
                      - message: ipv6 must be a valid IPv6 address/CIDR
                        rule: cidr(string(self)).ip().family() == 6
                      - message: Invalid CIDR format
                        rule: isCIDR(self)
                  type: object
                description: Optional structured per-node configuration (Supports
                  multi-family)
                maxProperties: 500
                type: object
              ipFamily:
                default: ipv4-only
                description: IP Family configuration (defaults to ipv4-only if omitted)
                enum:
                - ipv4-only
                - ipv6-only
                - dual-stack
                type: string
              ips:
                additionalProperties:
                  maxLength: 64
                  type: string
                  x-kubernetes-validations:
                  - message: Invalid CIDR format
                    rule: isCIDR(self)
                description: Optional map, validated if mode=static (Legacy IPv4-only)
                maxProperties: 500
                type: object
              mode:
                description: Required, non-empty, only 'static' or 'dhcp'
                enum:
                - static
                - dhcp
                minLength: 1
                type: string
              nodeSelector:
                description: |-
                  Optional: select target nodes by labels
                  If empty, applies to all nodes
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              underlay:
                type: boolean
              vlanID:
                description: Required, must be 1-4094
                maximum: 4094
                minimum: 1
                type: integer
            required:
            - clusterNetwork
            - mode
            - vlanID
            type: object
          status:
            properties:
              conditions:
                description: global observed state
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    lastUpdateTime:
                      description: The last time this condition was updated.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type of the condition.
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              nodeStatus:
                additionalProperties:
                  properties:
                    conditions:
                      description: Node-specific conditions
                      items:
                        properties:
                          lastTransitionTime:
                            description: Last time the condition transitioned from
                              one status to another.
                            type: string
                          lastUpdateTime:
                            description: The last time this condition was updated.
                            type: string
                          message:
                            description: Human-readable message indicating details
                              about last transition
                            type: string
                          reason:
                            description: The reason for the condition's last transition.
                            type: string
                          status:
                            description: Status of the condition, one of True, False,
                              Unknown.
                            type: string
                          type:
                            description: Type of the condition.
                            type: string
                        required:
                        - status
                        - type
                        type: object
                      type: array
                    ipFamily:
                      description: Applied IP family. If empty (e.g., on upgrade paths),
                        fallback to spec.ipFamily.
                      type: string
                    mode:
                      description: Mode static or dhcp. If empty (e.g., on upgrade
                        paths), fallback to spec.mode.
                      type: string
                    network:
                      description: Observed and active network configuration (records
                        static config or active DHCP lease)
                      properties:
                        gatewayIPv4:
                          description: Active IPv4 gateway
                          type: string
                        gatewayIPv6:
                          description: Active IPv6 gateway
                          type: string
                        ipv4:
                          description: Active IPv4 address
                          type: string
                        ipv6:
                          description: Active IPv6 address
                          type: string
                      type: object
                  type: object
                description: |-
                  Per-node observed state
                  key = node name
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: Fields 'ips' and 'hostMultiFamilyIPs' are mutually exclusive; use
            'hostMultiFamilyIPs' for advanced configurations.
          rule: '!(has(self.spec.ips) && has(self.spec.hostMultiFamilyIPs))'
        - message: Either 'ips' or 'hostMultiFamilyIPs' must be specified and non-empty
            when mode is static
          rule: self.spec.mode != 'static' || (has(self.spec.ips) && size(self.spec.ips)
            > 0) || (has(self.spec.hostMultiFamilyIPs) && size(self.spec.hostMultiFamilyIPs)
            > 0)
        - message: spec.ipFamily is immutable after creation
          rule: '(has(oldSelf.spec.ipFamily) ? oldSelf.spec.ipFamily : ''ipv4-only'')
            == (has(self.spec.ipFamily) ? self.spec.ipFamily : ''ipv4-only'')'
        - message: spec.vlanID is immutable after creation
          rule: oldSelf.spec.vlanID == self.spec.vlanID
        - message: spec.clusterNetwork is immutable after creation
          rule: oldSelf.spec.clusterNetwork == self.spec.clusterNetwork
    served: true
    storage: true
    subresources:
      status: {}
