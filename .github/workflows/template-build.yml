on:
  workflow_call:
    inputs:
      refs:
        required: false
        type: string
      release-tag-name:
        required: true
        type: string
      push:
        required: true
        type: boolean

jobs:
  dapper-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: harvester-network-controller
            dockerfile: package/Dockerfile
          - image: harvester-network-helper
            dockerfile: package/Dockerfile.helper
          - image: harvester-network-webhook
            dockerfile: package/Dockerfile.webhook
    steps:
    - name: Checkout code without refs
      if: ${{ inputs.refs == '' }}
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Checkout code with refs
      if: ${{ inputs.refs != '' }}
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: ${{ inputs.refs }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

    - name: Run dapper
      run: make ci

    - name: Build and publish ${{ matrix.image }} image
      if: ${{ inputs.push == true }}
      uses: harvester/harvester-actions/actions/build-and-publish@18134d283bc63c5a7ffb25191e6cd2f367a10932 # main
      with:
        release-tag-name: ${{ inputs.release-tag-name }}
        dockerfile: ${{ matrix.dockerfile }}
        image: ${{ matrix.image }}
